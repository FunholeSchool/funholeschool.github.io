<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: url('https://i.imghippo.com/files/L4I2P1718986973.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .logo-container {
            display: inline-block;
            padding: 40px; /* Increased padding */
            background: rgba(240, 240, 240, 0.8);
            border-radius: 30px; /* Increased rounded corners */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px; /* Space below the logo */
        }
        .logo-container img {
            max-width: 300px; /* Increased max-width for the logo */
            height: auto;
        }
        .feedback-container {
            width: 100%;
            max-width: 400px;
            height: 100px;
            background-color: #f0f0f0;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease-out;
            margin-bottom: 40px; /* Space below the feedback section */
        }
        .feedback-container.hide {
            opacity: 0;
            height: 0;
            overflow: hidden;
        }
        .feedback-text {
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .feedback-button-container {
            display: flex;
        }
        .feedback-button {
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 10px;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        .feedback-button:hover {
            background-color: #f0f0f0;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 80%;
            max-width: 800px;
        }
        .button {
            display: inline-block;
            width: 200px;
            height: 200px;
            line-height: 200px;
            font-size: 22px;
            color: #fff;
            position: relative;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            transition: transform 0.3s ease;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(#ff7e5f, #feb47b);
            z-index: 1;
        }
        .button img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }
        .button:hover {
            transform: scale(1.05);
        }
        .button.page1::before {
            background: linear-gradient(#ff7e5f, #feb47b);
        }
        .button.page2::before {
            background: linear-gradient(#6a11cb, #2575fc);
        }
        .button.page3::before {
            background: linear-gradient(#00c6ff, #0072ff);
        }
        .button.page4::before {
            background: linear-gradient(#ff512f, #dd2476);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="https://i.ibb.co/VJMPmV0/logolauncher-NL.png" alt="Funhole Sch00L Logo">
    </div>
    
    <div class="feedback-container" id="feedbackContainer">
        <div class="feedback-text">Do You Like The New Look?</div>
        <div class="feedback-button-container">
            <div class="feedback-button" onclick="handleFeedback('like')">👍</div>
            <div class="feedback-button" onclick="handleFeedback('dislike')">👎</div>
        </div>
    </div>

    <div class="button-container">
        <a href="page1.html" class="button page1"><img src="https://example.com/image1.jpg" alt="Page 1"></a>
        <a href="page2.html" class="button page2"><img src="https://example.com/image2.jpg" alt="Page 2"></a>
        <a href="page3.html" class="button page3"><img src="https://example.com/image3.jpg" alt="Page 3"></a>
        <a href="page4.html" class="button page4"><img src="https://example.com/image4.jpg" alt="Page 4"></a>
    </div>

    <script>
        function handleFeedback(feedback) {
            var feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.classList.add('hide');
            console.log("User feedback:", feedback);
        }
    </script>
</body>
</html>
